def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.zapiack.reactnative"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
    // Only until the Android library is on Maven Central.
    mavenLocal()
}

dependencies {
    // The version comes from the app's React Native Gradle plugin.
    implementation "com.facebook.react:react-android"
    api "com.zapiack:zapiack-android:0.1.0"
}
